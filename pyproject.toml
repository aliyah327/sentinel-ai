[project]
name = "sentinel-ai"
version = "0.1.0"
description = "A small, auditable red-teaming harness for LLM guardrails (canary-token method)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # core runs on the standard library alone

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
test = ["pytest>=7.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
